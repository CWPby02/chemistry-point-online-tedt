<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Result — CPES</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    .result-score { font-size:4rem; font-weight:var(--font-weight-bold); color:var(--color-primary); }
    .result-grade { font-size:2.5rem; font-weight:var(--font-weight-bold); color:var(--color-primary); margin-top:4px; }
    .result-details { display:flex; justify-content:center; gap:24px; flex-wrap:wrap; margin:16px 0; }
    .result-details strong { display:block; font-size:1.6rem; }
    .result-details .correct strong { color:var(--color-success); }
    .result-details .wrong strong { color:var(--color-danger); }
    .question-review { margin:16px 0; text-align:left; background:var(--color-bg); border-radius:var(--radius-md); padding:12px 16px; max-height:300px; overflow-y:auto; }
    .question-review .q-item { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--color-border); }
    .question-review .q-item:last-child { border-bottom:none; }
    .q-item .status { font-weight:var(--font-weight-bold); }
    .q-item .status.correct { color:var(--color-success); }
    .q-item .status.wrong { color:var(--color-danger); }

    /* ==========================================================
       PREMIUM RECTANGLE CERTIFICATE (NO CROP)
       ========================================================== */
    .certificate-wrapper {
      margin-top: 24px;
      padding: 16px;
      background: linear-gradient(145deg, #e8e0d0, #d5cbb8);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      display: flex;
      justify-content: center;
    }

    .certificate-box {
      width: 100%;
      max-width: 700px;
      background: #ffffff;
      padding: 28px 32px 24px;
      border-radius: 12px;
      border: 8px double #c9a84c;
      position: relative;
      box-shadow: 0 0 0 3px #c9a84c inset, 0 0 0 6px #f3edd8 inset;
      text-align: center;
      font-family: 'Georgia', 'Times New Roman', serif;
      box-sizing: border-box;
    }

    /* Decorative inner border */
    .certificate-box::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border: 2px solid #dbb86c;
      border-radius: 8px;
      pointer-events: none;
    }

    .cert-top-decoration {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      border-bottom: 3px solid #c9a84c;
      padding-bottom: 6px;
    }
    .cert-top-decoration .cert-logo {
      font-size: 2rem;
      color: #c9a84c;
    }
    .cert-top-decoration .cert-serial {
      font-size: 0.75rem;
      color: #999;
      font-family: 'Courier New', monospace;
      background: #f5f0e6;
      padding: 2px 12px;
      border-radius: 20px;
    }

    .cert-institute {
      font-size: 1.8rem;
      font-weight: bold;
      color: #1a1a2e;
      letter-spacing: 2px;
      margin-bottom: 2px;
    }
    .cert-institute span { color: #c9a84c; }

    .cert-subtitle {
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .cert-main-title {
      font-size: 2rem;
      font-weight: bold;
      color: #1a1a2e;
      letter-spacing: 6px;
      text-transform: uppercase;
      border-top: 3px solid #c9a84c;
      border-bottom: 3px solid #c9a84c;
      display: inline-block;
      padding: 6px 24px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fdf8ee, #f5eddb);
    }

    .cert-student-name {
      font-size: 2.2rem;
      font-weight: bold;
      color: #1a1a2e;
      margin: 6px 0 4px;
      border-bottom: 3px dashed #dbb86c;
      display: inline-block;
      padding: 0 20px 6px;
    }

    .cert-completion-text {
      font-size: 1rem;
      color: #333;
      margin: 6px 0;
    }
    .cert-completion-text strong {
      color: #1a1a2e;
      font-size: 1.1rem;
    }

    .cert-details-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin: 10px 0 14px;
      font-size: 0.95rem;
      color: #444;
    }
    .cert-details-row span {
      background: #f5f0e6;
      padding: 4px 18px;
      border-radius: 30px;
      border: 1px solid #e0d5c0;
    }
    .cert-details-row strong { color: #1a1a2e; }

    .cert-grade-badge {
      display: inline-block;
      background: linear-gradient(135deg, #c9a84c, #b8923a);
      color: #fff;
      font-size: 1.8rem;
      font-weight: bold;
      padding: 4px 28px;
      border-radius: 12px;
      margin: 6px 0 12px;
      letter-spacing: 2px;
      box-shadow: 0 4px 10px rgba(201,168,76,0.3);
    }

    .cert-footer {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 3px solid #e0d5c0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: #555;
      flex-wrap: wrap;
      gap: 8px;
    }
    .cert-footer .cert-director {
      font-weight: bold;
      color: #1a1a2e;
    }
    .cert-footer .cert-director small {
      font-weight: normal;
      color: #888;
      display: block;
      font-size: 0.7rem;
    }
    .cert-footer .cert-seal {
      font-size: 2.5rem;
      color: #c9a84c;
      opacity: 0.7;
    }
    .cert-footer .cert-date {
      font-size: 0.85rem;
      color: #888;
    }

    /* Stamp */
    .cert-stamp {
      position: absolute;
      bottom: 40px;
      right: 30px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 4px solid rgba(201,168,76,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      color: rgba(201,168,76,0.35);
      font-weight: bold;
      text-transform: uppercase;
      transform: rotate(-15deg);
      pointer-events: none;
      background: rgba(201,168,76,0.05);
      font-family: 'Georgia', serif;
      padding: 10px;
      text-align: center;
      line-height: 1.2;
    }

    .cert-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .no-result {
      text-align: center;
      padding: 40px 20px;
    }
    .no-result .material-symbols-rounded {
      font-size: 4rem;
      color: var(--color-warning);
    }

    @media (max-width: 600px) {
      .certificate-box { padding: 18px 14px 16px; }
      .cert-institute { font-size: 1.4rem; }
      .cert-main-title { font-size: 1.4rem; letter-spacing: 3px; padding: 4px 12px; }
      .cert-student-name { font-size: 1.6rem; }
      .cert-completion-text { font-size: 0.85rem; }
      .cert-details-row { font-size: 0.8rem; gap: 10px; }
      .cert-grade-badge { font-size: 1.4rem; padding: 3px 18px; }
      .cert-footer { font-size: 0.75rem; flex-direction: column; align-items: center; }
      .cert-stamp { width: 60px; height: 60px; font-size: 0.5rem; bottom: 24px; right: 16px; }
      .cert-top-decoration .cert-logo { font-size: 1.5rem; }
      .cert-top-decoration .cert-serial { font-size: 0.6rem; }
    }
    @media (max-width: 400px) {
      .cert-main-title { font-size: 1.1rem; letter-spacing: 1px; }
      .cert-student-name { font-size: 1.2rem; }
      .cert-details-row span { font-size: 0.7rem; padding: 2px 10px; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="navbar__container container">
      <a href="../index.html" class="navbar__brand">
        <span class="navbar__logo-icon material-symbols-rounded">science</span>
        <span class="navbar__brand-text">CPES</span>
      </a>
      <a href="../index.html" class="btn btn--outline btn--sm">Home</a>
    </div>
  </header>

  <main style="padding:30px 0;">
    <div class="container" style="max-width:820px;">
      <div class="glass-card" id="resultContainer">
        <div id="resultContent">
          <div class="no-result">
            <span class="material-symbols-rounded">hourglass_empty</span>
            <h3>No result found</h3>
            <p class="text-muted">Please complete a quiz first.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAJxrqXisH2oBk8naB7TJMnGsoO2RIm6Tg",
      authDomain: "cpes-a88a2.firebaseapp.com",
      databaseURL: "https://cpes-a88a2-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cpes-a88a2",
      storageBucket: "cpes-a88a2.firebasestorage.app",
      messagingSenderId: "350376945623",
      appId: "1:350376945623:web:eb884eb5cdac3f05aa0d92"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function loadResult() {
      const container = document.getElementById('resultContent');
      const resultJSON = localStorage.getItem('cpes_result');
      if (!resultJSON) {
        container.innerHTML = `<div class="no-result"><span class="material-symbols-rounded">hourglass_empty</span><h3>No result found</h3><p class="text-muted">Please complete a quiz first.</p></div>`;
        return;
      }

      try {
        const result = JSON.parse(resultJSON);
        const { studentName, total, correct, wrong, score, grade, detailed, quizId, timestamp } = result;
        const percentage = Math.round((correct / total) * 100);

        let quizTitle = 'Chemistry Quiz';
        db.collection('quizzes').doc(quizId).get().then(doc => {
          if (doc.exists) quizTitle = doc.data().title || 'Chemistry Quiz';
          renderResult(quizTitle);
        }).catch(() => renderResult(quizTitle));

        function renderResult(title) {
          let reviewHtml = '';
          if (detailed && detailed.length) {
            reviewHtml = '<div class="question-review"><h4>📝 Question Review</h4>';
            detailed.forEach((item, idx) => {
              const statusClass = item.isCorrect ? 'correct' : 'wrong';
              const statusText = item.isCorrect ? '✅ Correct' : '❌ Wrong';
              reviewHtml += `<div class="q-item"><span><strong>Q${idx+1}</strong> (Your Answer: ${item.userAnswer !== undefined ? item.userAnswer : 'N/A'})</span><span class="status ${statusClass}">${statusText}</span></div>`;
            });
            reviewHtml += '</div>';
          }

          const dateStr = new Date(timestamp || Date.now()).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });

          container.innerHTML = `
            <div class="result-score">${percentage}%</div>
            <div class="result-grade">${grade || 'N/A'}</div>
            <div class="result-details">
              <span class="correct"><strong>${correct}</strong> Correct</span>
              <span class="wrong"><strong>${wrong}</strong> Wrong</span>
              <span class="total"><strong>${total}</strong> Total</span>
            </div>
            <p style="color:var(--color-text-secondary);margin-bottom:12px;">
              ${percentage >= 70 ? '🎉 Excellent! You\'ve passed with flying colors.' :
                percentage >= 40 ? '👍 Good effort! Keep practicing.' :
                '📚 Don\'t give up! Review and try again.'}
            </p>
            ${reviewHtml}

            <!-- PREMIUM CERTIFICATE -->
            <div class="certificate-wrapper" id="certificateWrapper">
              <div class="certificate-box" id="certificateBox">
                <div class="cert-top-decoration">
                  <span class="cert-logo">⚗️</span>
                  <span class="cert-serial">#CPES-${String(Date.now()).slice(-6)}</span>
                </div>
                <div class="cert-institute">Chemistry Point <span>⚡</span></div>
                <div class="cert-subtitle">by Pradeep Sir</div>
                <div class="cert-main-title">Certificate of Completion</div>
                <div class="cert-student-name">${studentName || 'Student'}</div>
                <div class="cert-completion-text">has successfully completed the <strong>${title}</strong></div>
                <div class="cert-details-row">
                  <span>📊 Score: <strong>${percentage}%</strong></span>
                  <span>✅ Correct: <strong>${correct}</strong></span>
                  <span>📅 Date: <strong>${dateStr}</strong></span>
                </div>
                <div class="cert-grade-badge">Grade: ${grade || 'N/A'}</div>
                <div class="cert-footer">
                  <div class="cert-director">👨‍🏫 Pradeep Sir <small>Director, Chemistry Point</small></div>
                  <div class="cert-seal">🏅</div>
                  <div class="cert-date">Issued: ${dateStr}</div>
                </div>
                <div class="cert-stamp">Chemistry Point<br>Pradeep Sir</div>
              </div>
            </div>

            <div class="cert-actions">
              <button class="btn btn--primary" onclick="downloadPNG()"><span class="material-symbols-rounded">image</span> PNG</button>
              <button class="btn btn--primary" onclick="downloadPDF()"><span class="material-symbols-rounded">picture_as_pdf</span> PDF</button>
              <button class="btn btn--primary" onclick="shareCertificate()"><span class="material-symbols-rounded">share</span> Share</button>
              <button class="btn btn--outline" onclick="window.print()"><span class="material-symbols-rounded">print</span> Print</button>
            </div>
          `;
        }
      } catch (e) {
        container.innerHTML = `<p style="color:var(--color-danger);">Error loading result: ${e.message}</p>`;
      }
    }

    // ==========================================================
    // DOWNLOAD FUNCTIONS – FULL CAPTURE, NO CROP
    // ==========================================================
    function downloadPNG() {
      const el = document.getElementById('certificateBox');
      html2canvas(el, {
        scale: 3,
        backgroundColor: '#ffffff',
        useCORS: true,
        logging: false,
        width: el.scrollWidth,
        height: el.scrollHeight,
        windowWidth: el.scrollWidth,
        windowHeight: el.scrollHeight
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `Certificate_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => alert('PNG error: ' + err.message));
    }

    function downloadPDF() {
      const el = document.getElementById('certificateBox');
      html2canvas(el, {
        scale: 3,
        backgroundColor: '#ffffff',
        useCORS: true,
        logging: false,
        width: el.scrollWidth,
        height: el.scrollHeight,
        windowWidth: el.scrollWidth,
        windowHeight: el.scrollHeight
      }).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('l', 'mm', 'a4');
        const imgWidth = 280;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        const x = (297 - imgWidth) / 2;
        const y = (210 - imgHeight) / 2;
        pdf.addImage(imgData, 'PNG', x, y, imgWidth, imgHeight);
        pdf.save(`Certificate_${Date.now()}.pdf`);
      }).catch(err => alert('PDF error: ' + err.message));
    }

    // Share
    function shareCertificate() {
      const el = document.getElementById('certificateBox');
      html2canvas(el, {
        scale: 3,
        backgroundColor: '#ffffff',
        useCORS: true,
        logging: false,
        width: el.scrollWidth,
        height: el.scrollHeight,
        windowWidth: el.scrollWidth,
        windowHeight: el.scrollHeight
      }).then(canvas => {
        canvas.toBlob(function(blob) {
          const file = new File([blob], 'Certificate.png', { type: 'image/png' });
          if (navigator.share) {
            navigator.share({
              title: 'My Certificate',
              text: 'Check out my certificate from Chemistry Point!',
              files: [file]
            }).catch(() => {});
          } else {
            alert('Share not supported on this browser.');
          }
        });
      }).catch(err => alert('Share error: ' + err.message));
    }

    loadResult();
  </script>
</body>
</html>
