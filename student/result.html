<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Result — CPES</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    .result-score { font-size:4rem; font-weight:bold; color:var(--color-primary); }
    .result-grade { font-size:2.5rem; font-weight:bold; color:var(--color-primary); }
    .result-details { display:flex; justify-content:center; gap:24px; flex-wrap:wrap; margin:16px 0; }
    .result-details strong { display:block; font-size:1.6rem; }
    .result-details .correct strong { color:green; }
    .result-details .wrong strong { color:red; }
    .question-review { margin:16px 0; text-align:left; background:#f8f9fe; border-radius:8px; padding:12px 16px; max-height:300px; overflow-y:auto; }
    .question-review .q-item { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #ddd; }
    .question-review .q-item:last-child { border-bottom:none; }
    .q-item .status { font-weight:bold; }
    .q-item .status.correct { color:green; }
    .q-item .status.wrong { color:red; }

    /* ==========================================================
       CERTIFICATE – SIMILAR TO SCREENSHOT (FIXED SIZE)
       ========================================================== */
    .certificate-wrapper {
      margin-top: 24px;
      padding: 20px;
      background: #f5f0e1;
      border-radius: 12px;
      display: flex;
      justify-content: center;
    }

    .certificate-box {
      width: 800px;
      height: 500px;
      background: #ffffff;
      padding: 30px 40px 20px;
      border-radius: 12px;
      border: 6px double #c9a84c;
      box-shadow: 0 0 0 3px #c9a84c inset;
      box-sizing: border-box;
      text-align: center;
      font-family: 'Georgia', 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Decorative inner border */
    .certificate-box::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border: 2px solid #dbb86c;
      border-radius: 8px;
      pointer-events: none;
    }

    .cert-header {
      border-bottom: 2px solid #c9a84c;
      padding-bottom: 6px;
      margin-bottom: 6px;
    }
    .cert-header .institute {
      font-size: 2.2rem;
      font-weight: bold;
      color: #1a1a2e;
      letter-spacing: 3px;
    }
    .cert-header .institute span { color: #c9a84c; }
    .cert-header .byline {
      font-size: 1.1rem;
      color: #666;
      letter-spacing: 2px;
      margin-top: -4px;
    }

    .cert-title {
      font-size: 2rem;
      font-weight: bold;
      color: #1a1a2e;
      letter-spacing: 4px;
      text-transform: uppercase;
      border-top: 2px solid #c9a84c;
      border-bottom: 2px solid #c9a84c;
      display: inline-block;
      padding: 4px 20px;
      margin: 6px auto 8px;
      background: #fdf8ee;
    }

    .cert-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .cert-body .prefix {
      font-size: 1rem;
      color: #333;
      margin-bottom: 2px;
    }
    .cert-body .student-name {
      font-size: 2.4rem;
      font-weight: bold;
      color: #1a1a2e;
      border-bottom: 2px dashed #c9a84c;
      display: inline-block;
      padding: 0 20px 4px;
      margin: 0 auto 4px;
    }
    .cert-body .completion-text {
      font-size: 1rem;
      color: #333;
      margin: 4px 0;
    }
    .cert-body .exam-details {
      font-size: 1rem;
      color: #444;
      margin: 4px 0;
    }
    .cert-body .marks-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      margin: 6px 0 10px;
      font-size: 1.1rem;
    }
    .cert-body .marks-row span {
      background: #f5f0e6;
      padding: 4px 18px;
      border-radius: 30px;
      border: 1px solid #ddd;
    }
    .cert-body .marks-row strong { color: #1a1a2e; }

    .cert-body .grade-box {
      display: inline-block;
      background: #c9a84c;
      color: #fff;
      font-size: 1.6rem;
      font-weight: bold;
      padding: 4px 24px;
      border-radius: 8px;
      margin: 4px auto;
    }

    .cert-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-top: 2px solid #e0d5c0;
      padding-top: 10px;
      font-size: 0.95rem;
      color: #555;
    }
    .cert-footer .signature {
      text-align: left;
    }
    .cert-footer .signature .name {
      font-weight: bold;
      color: #1a1a2e;
      font-size: 1.1rem;
    }
    .cert-footer .signature .title {
      font-size: 0.8rem;
      color: #888;
    }
    .cert-footer .date {
      text-align: right;
      font-size: 0.9rem;
      color: #888;
    }
    .cert-footer .date strong { color: #1a1a2e; }

    /* Stamp */
    .cert-stamp {
      position: absolute;
      bottom: 20px;
      right: 24px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid rgba(201,168,76,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      color: rgba(201,168,76,0.4);
      font-weight: bold;
      text-transform: uppercase;
      transform: rotate(-15deg);
      background: rgba(201,168,76,0.05);
      text-align: center;
      line-height: 1.2;
      padding: 6px;
      pointer-events: none;
    }

    .cert-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .no-result { text-align:center; padding:40px 20px; }

    /* Responsive scaling */
    @media (max-width: 850px) {
      .certificate-box {
        width: 100%;
        max-width: 600px;
        height: auto;
        aspect-ratio: 800 / 500;
        padding: 20px 24px 16px;
      }
      .cert-header .institute { font-size: 1.8rem; }
      .cert-title { font-size: 1.6rem; }
      .cert-body .student-name { font-size: 2rem; }
      .cert-body .marks-row { font-size: 0.95rem; gap: 12px; }
      .cert-body .grade-box { font-size: 1.3rem; padding: 2px 16px; }
      .cert-stamp { width: 55px; height: 55px; font-size: 0.45rem; bottom: 16px; right: 16px; }
      .cert-footer { font-size: 0.8rem; flex-wrap: wrap; gap: 6px; }
    }
    @media (max-width: 450px) {
      .certificate-box { padding: 14px 12px 12px; border-width: 4px; }
      .cert-header .institute { font-size: 1.4rem; }
      .cert-title { font-size: 1.2rem; padding: 2px 12px; }
      .cert-body .student-name { font-size: 1.5rem; }
      .cert-body .marks-row { font-size: 0.75rem; gap: 6px; }
      .cert-body .marks-row span { padding: 2px 10px; }
      .cert-body .grade-box { font-size: 1rem; padding: 2px 12px; }
      .cert-stamp { width: 40px; height: 40px; font-size: 0.35rem; bottom: 10px; right: 10px; }
      .cert-footer { font-size: 0.65rem; flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="navbar__container container">
      <a href="../index.html" class="navbar__brand">
        <span class="navbar__logo-icon material-symbols-rounded">science</span>
        <span class="navbar__brand-text">CPES</span>
      </a>
      <a href="../index.html" class="btn btn--outline btn--sm">Home</a>
    </div>
  </header>

  <main style="padding:30px 0;">
    <div class="container" style="max-width:850px;">
      <div class="glass-card" id="resultContainer">
        <div id="resultContent"><div class="no-result"><span class="material-symbols-rounded">hourglass_empty</span><h3>No result found</h3><p class="text-muted">Please complete a quiz first.</p></div></div>
      </div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAJxrqXisH2oBk8naB7TJMnGsoO2RIm6Tg",
      authDomain: "cpes-a88a2.firebaseapp.com",
      databaseURL: "https://cpes-a88a2-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cpes-a88a2",
      storageBucket: "cpes-a88a2.firebasestorage.app",
      messagingSenderId: "350376945623",
      appId: "1:350376945623:web:eb884eb5cdac3f05aa0d92"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function loadResult() {
      const container = document.getElementById('resultContent');
      const resultJSON = localStorage.getItem('cpes_result');
      if (!resultJSON) {
        container.innerHTML = `<div class="no-result"><span class="material-symbols-rounded">hourglass_empty</span><h3>No result found</h3><p class="text-muted">Please complete a quiz first.</p></div>`;
        return;
      }

      try {
        const result = JSON.parse(resultJSON);
        const { studentName, total, correct, wrong, score, grade, detailed, quizId, timestamp } = result;
        const percentage = Math.round((correct / total) * 100);

        let quizTitle = 'Chemistry Quiz';
        db.collection('quizzes').doc(quizId).get().then(doc => {
          if (doc.exists) quizTitle = doc.data().title || 'Chemistry Quiz';
          renderResult(quizTitle);
        }).catch(() => renderResult(quizTitle));

        function renderResult(title) {
          let reviewHtml = '';
          if (detailed && detailed.length) {
            reviewHtml = '<div class="question-review"><h4>📝 Question Review</h4>';
            detailed.forEach((item, idx) => {
              const statusClass = item.isCorrect ? 'correct' : 'wrong';
              const statusText = item.isCorrect ? '✅ Correct' : '❌ Wrong';
              reviewHtml += `<div class="q-item"><span><strong>Q${idx+1}</strong> (Your Answer: ${item.userAnswer ?? 'N/A'})</span><span class="status ${statusClass}">${statusText}</span></div>`;
            });
            reviewHtml += '</div>';
          }

          const dateStr = new Date(timestamp || Date.now()).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });

          // Grade text mapping
          let gradeText = grade || 'N/A';
          if (grade === 'A+') gradeText = 'Excellent';
          else if (grade === 'A') gradeText = 'Very Good';
          else if (grade === 'B') gradeText = 'Good';
          else if (grade === 'C') gradeText = 'Average';
          else if (grade === 'D') gradeText = 'Needs Improvement';
          else if (grade === 'F') gradeText = 'Needs Improvement';

          container.innerHTML = `
            <div class="result-score">${percentage}%</div>
            <div class="result-grade">${grade || 'N/A'}</div>
            <div class="result-details">
              <span class="correct"><strong>${correct}</strong> Correct</span>
              <span class="wrong"><strong>${wrong}</strong> Wrong</span>
              <span class="total"><strong>${total}</strong> Total</span>
            </div>
            <p>${percentage>=70?'🎉 Excellent!':percentage>=40?'👍 Good effort!':'📚 Keep learning!'}</p>
            ${reviewHtml}

            <!-- CERTIFICATE (Screenshot style) -->
            <div class="certificate-wrapper">
              <div class="certificate-box" id="certificateBox">
                <div class="cert-header">
                  <div class="institute">CHEMISTRY POINT <span>⚡</span></div>
                  <div class="byline">By Pardeep Sir</div>
                </div>

                <div class="cert-title">CERTIFICATE OF PERFORMANCE</div>

                <div class="cert-body">
                  <div class="prefix">This is to officially certify that</div>
                  <div class="student-name">${studentName || 'Student'}</div>
                  <div class="completion-text">has successfully completed the Online Chemistry Mock Examination on <strong>${dateStr}</strong>.</div>
                  <div class="marks-row">
                    <span>📝 Marks Obtained: <strong>${correct} / ${total}</strong></span>
                    <span>📊 Percentage: <strong>${percentage}%</strong></span>
                  </div>
                  <div class="grade-box">${gradeText}</div>
                </div>

                <div class="cert-footer">
                  <div class="signature">
                    <div class="name">Pardeep Sir</div>
                    <div class="title">(Director &amp; HOD Chemistry)</div>
                  </div>
                  <div class="date">
                    Date of Issue<br><strong>${dateStr}</strong>
                  </div>
                </div>

                <div class="cert-stamp">Chemistry Point<br>Pardeep Sir</div>
              </div>
            </div>

            <div class="cert-actions">
              <button class="btn btn--primary" onclick="downloadPNG()"><span class="material-symbols-rounded">image</span> PNG</button>
              <button class="btn btn--primary" onclick="downloadPDF()"><span class="material-symbols-rounded">picture_as_pdf</span> PDF</button>
              <button class="btn btn--primary" onclick="shareCertificate()"><span class="material-symbols-rounded">share</span> Share</button>
              <button class="btn btn--outline" onclick="window.print()"><span class="material-symbols-rounded">print</span> Print</button>
            </div>
          `;
        }
      } catch(e) {
        container.innerHTML = `<p style="color:red;">Error: ${e.message}</p>`;
      }
    }

    // ===== DOWNLOAD FUNCTIONS – CAPTURE FULL 800x500 =====
    function downloadPNG() {
      const el = document.getElementById('certificateBox');
      html2canvas(el, {
        scale: 2.5,
        backgroundColor: '#ffffff',
        useCORS: true,
        logging: false,
        width: 800,
        height: 500,
        windowWidth: 800,
        windowHeight: 500
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `Certificate_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => alert('PNG error: ' + err.message));
    }

    function downloadPDF() {
      const el = document.getElementById('certificateBox');
      html2canvas(el, {
        scale: 2.5,
        backgroundColor: '#ffffff',
        useCORS: true,
        logging: false,
        width: 800,
        height: 500,
        windowWidth: 800,
        windowHeight: 500
      }).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('l', 'mm', 'a4');
        const imgWidth = 280;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        const x = (297 - imgWidth) / 2;
        const y = (210 - imgHeight) / 2;
        pdf.addImage(imgData, 'PNG', x, y, imgWidth, imgHeight);
        pdf.save(`Certificate_${Date.now()}.pdf`);
      }).catch(err => alert('PDF error: ' + err.message));
    }

    function shareCertificate() {
      const el = document.getElementById('certificateBox');
      html2canvas(el, {
        scale: 2.5,
        backgroundColor: '#ffffff',
        useCORS: true,
        logging: false,
        width: 800,
        height: 500,
        windowWidth: 800,
        windowHeight: 500
      }).then(canvas => {
        canvas.toBlob(function(blob) {
          const file = new File([blob], 'Certificate.png', { type: 'image/png' });
          if (navigator.share) {
            navigator.share({ title: 'My Certificate', text: 'Certificate from Chemistry Point', files: [file] })
              .catch(() => {});
          } else {
            alert('Share not supported.');
          }
        });
      }).catch(err => alert('Share error: ' + err.message));
    }

    loadResult();
  </script>
</body>
</html>
